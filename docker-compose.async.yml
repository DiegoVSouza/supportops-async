name: supportops-async-local
services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: supportops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportops -d supportops"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "127.0.0.1:14566:4566"
    volumes:
      - ./infra/localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
  api:
    build: .
    command: ["uvicorn", "supportops_async.api.runtime:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.example
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:18000:8000"
  worker:
    build: .
    command: ["python", "-m", "supportops_async.worker.cli"]
    env_file: .env.example
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
