name: supportops-async-local
services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: supportops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportops -d supportops"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
  api:
    build: .
    command: ["uvicorn", "supportops_async.api.runtime:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.example
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
    ports:
      - "8000:8000"
  worker:
    build: .
    command: ["python", "-m", "supportops_async.worker.cli"]
    env_file: .env.example
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
volumes:
  postgres-data:
