name: harness-checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: uv sync --locked
      - run: docker compose -p p04-ci -f docker-compose.async.yml -f docker-compose.remediation.yml up -d --wait
      - run: uv run --locked python scripts/check_full.py
        env:
          LLM_MODE: fake
          P04_POSTGRES_DSN: postgresql://supportops:supportops@127.0.0.1:15432/supportops
          P04_LOCALSTACK_ENDPOINT: http://127.0.0.1:14566
      - if: always()
        run: docker compose -p p04-ci -f docker-compose.async.yml -f docker-compose.remediation.yml down
      - if: failure()
        run: cat artifacts/evidence/check-full.txt 2>/dev/null || true
