[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supportops-async"
version = "0.1.4"
description = "Durable asynchronous support operations task platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.137.1,<0.143.0",
  "opentelemetry-api==1.45.1",
  "uvicorn==0.46.0",
  "psycopg[binary]==3.2.10",
  "boto3==1.43.114",
  "redis==6.4.0",
]

[project.scripts]
supportops-worker = "supportops_async.worker.cli:main"

[project.optional-dependencies]
live = [
    "groq==1.7.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local external services", "e2e: subprocess or full-stack test"]

[tool.setuptools.packages.find]
include = ["supportops_async*"]

[tool.setuptools.package-data]
"supportops_async.store" = ["migrations/*.sql"]

