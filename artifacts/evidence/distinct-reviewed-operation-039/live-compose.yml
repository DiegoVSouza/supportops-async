name: p04-reviewed-live-039
services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: supportops
      POSTGRES_USER: supportops
      POSTGRES_PASSWORD: supportops
    ports: ["127.0.0.1:35532:5432"]
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U supportops -d supportops"]
      interval: 2s
      timeout: 3s
      retries: 30
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs,sns,iam,sts
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports: ["127.0.0.1:35566:4566"]
    volumes: ["localstack:/var/lib/localstack"]
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 3s
      retries: 60
volumes:
  pg:
  localstack:
